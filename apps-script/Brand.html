<!-- Optional appearance update for the CURRENT deployed Admin.html.
     Paste these contents immediately before its closing </head> tag.
     Do not replace the deployed Admin.html or Code.gs with older repository copies. -->
<style id="asme-brand-theme">
@font-face{font-family:'Mona Sans';src:url('https://jeojetson.github.io/Sponsorflow/assets/fonts/mona-sans-variable.woff2') format('woff2');font-weight:200 900;font-stretch:75% 125%;font-display:swap}
@font-face{font-family:'Bell MT';src:local('Bell MT'),local('BellMT');font-display:swap}
:root{color-scheme:light;--black:#242839;--gold:#cfb991;--gold2:#dfcdae;--paper:#f7f7f5;--white:#fff;--line:#dce0e5;--muted:#616578;--surface:#fff;--surface2:#f1f2f3;--green:#246845;--greenbg:#e9f3ed;--red:#a2363d;--redbg:#fbecee;--amber:#845719;--amberbg:#faf0de;--blue:#11688e;--bluebg:#e7f4fb;--radius:10px;--shadow:none}
html[data-theme=dark]{color-scheme:dark;--black:#f0f1f6;--paper:#171a24;--white:#202431;--surface:#202431;--surface2:#292e3e;--line:#3a4052;--muted:#b4baca;--green:#88d9ad;--greenbg:#203d32;--red:#ffb3b9;--redbg:#452d36;--amber:#f1cd88;--amberbg:#423927;--blue:#7ed2f5;--bluebg:#1d3b4c}
body,button,input,select,textarea,h1,h2,h3,.stat strong,.email-box{font-family:'Mona Sans',system-ui,sans-serif}body{background:var(--paper);color:var(--black)}h1,h2,h3{font-weight:650;letter-spacing:-.03em}.mark{transform:none;border-radius:2px;background:#cfb991;color:#242839}.header{background:var(--surface);color:var(--black);border-color:var(--line)}.brand small{color:var(--muted)}.sidebar{background:var(--surface);color:var(--black);border-right:1px solid var(--line)}.nav button{color:var(--muted);border-radius:6px}.nav button.active,.nav button:hover{background:#cfb991;color:#242839}.sidebar-note{color:var(--muted);border-color:var(--line)}.content-head h1{font-size:32px}.panel h2{font-size:22px}.panel,.table-card,.stat,.modal,.login-card{background:var(--surface);color:var(--black);border-color:var(--line);border-radius:10px;box-shadow:none}.field input,.field textarea,.field select,.toolbar input,.toolbar select{background:var(--surface);color:var(--black);border-color:var(--line);border-radius:6px}.field input:focus,.field textarea:focus,.field select:focus{outline:2px solid #2aace2;outline-offset:2px;border-color:#2aace2;box-shadow:none}.btn{border-radius:6px}.btn-primary{background:#cfb991;color:#242839}.btn-secondary,.header-actions .btn-secondary{background:var(--surface);color:var(--black);border-color:var(--line)}.btn-dark{background:#40455c;color:white}.btn-danger{background:var(--redbg);color:var(--red)}th{background:var(--surface2);color:var(--muted)}th,td,.item{border-color:var(--line)}tbody tr:hover{background:var(--surface2)}.detail,.email-box,.comment,.close{background:var(--surface2);color:var(--black);border-color:var(--line)}.login-page,.login-copy{background:#40455c;color:white}.login-copy{background-image:none}.login-copy h1{font-family:'Bell MT','Mona Sans',serif;font-weight:400;font-size:clamp(44px,5vw,70px)}.login-copy p{color:#e1e3ec}.login-panel{background:var(--paper)}.login-card h2{font-size:28px}.eyebrow{color:var(--muted)}.login-copy .eyebrow{color:#cfb991}.asme-admin-theme{position:fixed;z-index:100;right:18px;bottom:18px;min-width:44px;min-height:40px;padding:8px 12px;background:var(--surface);color:var(--black);border:1px solid var(--line);border-radius:7px;box-shadow:0 4px 16px #0001;font:600 12px 'Mona Sans',sans-serif}
@media(max-width:600px){.header{flex-direction:row;align-items:center;gap:10px;padding:12px 16px}.brand strong{font-size:12px}.header .mark{width:48px;height:34px;font-size:12px}.header-actions{gap:4px}.header-actions .btn{font-size:10px;padding:5px 8px}.sidebar{top:58px}.content{padding:22px 16px}.login-copy{padding:40px 24px;min-height:320px}.login-panel{padding:20px}.login-card{padding:26px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
<script>
(() => {
  const apply=theme=>{document.documentElement.dataset.theme=theme==='dark'?'dark':'light';document.querySelectorAll('[data-admin-theme]').forEach(b=>{b.textContent=theme==='dark'?'Light mode':'Dark mode';});};
  try{apply(localStorage.getItem('asmeWorkspaceTheme'));}catch(_){apply('light');}
  document.addEventListener('DOMContentLoaded',()=>{
    const button=document.createElement('button');button.type='button';button.className='asme-admin-theme';button.dataset.adminTheme='';
    button.addEventListener('click',()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';apply(next);try{localStorage.setItem('asmeWorkspaceTheme',next);}catch(_){}});
    document.body.appendChild(button);apply(document.documentElement.dataset.theme);
  });
})();
</script>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SponsorFlow Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/app.css?v=6">
</head>
<body class="admin-link-page">
  <main class="admin-link-card">
    <span class="brand-mark brand-mark-large">ASME</span>
    <p class="eyebrow">Officer workspace</p>
    <h1>Open the secure admin dashboard</h1>
    <p>The admin password is entered on the Google Apps Script dashboard—not on GitHub Pages.</p>
    <a id="adminDashboardLink" class="button button-primary button-full" href="#">Open admin dashboard</a>
    <a class="button button-secondary button-full" href="planner.html">Open project planner</a>
    <a class="button button-ghost button-full" href="index.html">Back to sponsor portal</a>
    <p id="adminConfigWarning" class="form-status"></p>
  </main>
  <script src="assets/config.js?v=6"></script>
  <script>
    const config = window.SPONSORFLOW_CONFIG || {};
    const link = document.getElementById('adminDashboardLink');
    const warning = document.getElementById('adminConfigWarning');
    if (!config.API_URL || config.API_URL.includes('PASTE_')) {
      link.setAttribute('aria-disabled', 'true');
      link.addEventListener('click', event => event.preventDefault());
      warning.textContent = 'The Apps Script URL has not been added to assets/config.js yet.';
    } else {
      link.href = config.API_URL + (config.API_URL.includes('?') ? '&' : '?') + 'view=admin';
    }
  </script>
</body>
</html>
